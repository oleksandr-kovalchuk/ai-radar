<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Radar</title><link rel="stylesheet" href="/radar/styles.css"></head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/radar/">AI Radar</a><span class="tagline">A directory of AI tools, rated by you</span></div></header>
<main class="wrap">
  <form id="filters" class="filters" role="search" onsubmit="return false">
    <input id="q" type="search" placeholder="Search tools by name or description" aria-label="Search tools">
    <select id="category" aria-label="Category"><option value="">All categories</option></select>
    <select id="tag" aria-label="Tag"><option value="">All tags</option></select>
    <button type="button" id="reset" class="btn">Reset</button>
  </form>
  <p id="count" class="muted" aria-live="polite"></p>
  <div id="grid" class="grid"></div>
</main>
<script src="/radar/app.js"></script>
</body></html>
