<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Radar</title><meta name="color-scheme" content="dark light">

<main class="wrap"><p><a class="back" href="/radar/">&larr; Back to all tools</a></p><article id="tool" class="detail"><div class="sk sk-title"></div><div class="sk sk-line"></div><div class="sk sk-line"></div></article></main>
<script src="/radar/app.js"></script>
</body></html>
